<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>oH-hooh</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; color: #1a1a1a; background: #fafafa;
    }
    main {
      text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 1.5rem;
    }
    .text-group {
      transform: translateY(-3rem);
    }
    h1 { font-size: 3rem; font-weight: 700; letter-spacing: -0.05em; margin-bottom: 0.5rem; }
    p { font-size: 1.1rem; color: #666; }
    .cursor {
      display: inline-block; width: 0.45em;
      animation: blink 1s step-end infinite;
      font-weight: 300; color: #666;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    ascii-art {
      display: block;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <main>
    <div class="text-group">
      <h1>oH-hooh</h1>
      <p>Coming soon<span class="cursor">_</span></p>
    </div>
    <ascii-art piece="sparks"></ascii-art>
  </main>
  <script type="module" src="https://ascii.rest/ascii.js"></script>
</body>
</html>
